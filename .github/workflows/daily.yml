name: daily-tracker
on:
  schedule:
    - cron: "30 22 * * 1-5"   # ABD kapanisindan sonra, hafta ici
  workflow_dispatch:
permissions:
  contents: write
jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.venvs
          key: venvs-${{ hashFiles('ci/setup_envs.sh') }}
      - run: pip install -r requirements.txt
      - run: bash ci/setup_envs.sh
      - run: python tracker.py
      - name: Lig
        env:
          FINRL_PY: /home/runner/.venvs/finrl/bin/python
          QLIB_PY: /home/runner/.venvs/qlib/bin/python
          FREQTRADE_PY: /home/runner/.venvs/freqtrade/bin/python
          MLFLOW_ALLOW_FILE_STORE: "true"
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: python league.py
      - run: python report.py
      - name: Commit results
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add tracker.json signals_log.csv STATUS.md league_state.json league.json
          git diff --cached --quiet || git commit -m "Gunluk takip $(date -u +%F)"
          git push
